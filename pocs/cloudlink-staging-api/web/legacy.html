<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CloudLink｜Legacy Compatibility Staging</title><link rel="stylesheet" href="/ui/styles.css"><script defer src="/ui/legacy.js"></script></head><body><header><div class="shell head"><div class="logo"><span>雲</span> CloudLink</div><div class="pill">M1b｜隔離測試</div></div></header><main class="shell"><section class="hero"><div class="eyebrow">CLOUDLINK LEGACY → TECH MATCH</div><h1>舊版發案資料相容測試</h1><p>僅支援已核對的網路工程、監視器、門禁類別；不是舊版完整 React 正式整合。</p></section><div class="warning">請只輸入虛構測試資料。沒有真實會員、金流、提款或公開接案。</div><div class="row controls"><label class="grow">本機測試權杖<input id="token" type="password" autocomplete="off"></label><button class="btn primary" id="refresh" type="button">讀取後端案件</button></div><div id="notice" class="notice" role="status">尚未連接</div><section class="card"><h2>舊版分類發案</h2><form id="legacy-form"><div class="cols"><label>工程類別<select name="categoryId"><option value="net">網路工程</option><option value="cctv">監視器</option><option value="access">門禁系統</option></select></label><label>地區<input name="region" value="台南市" required minlength="2" maxlength="60"></label></div><label>需求<textarea name="description" required minlength="12" maxlength="1000">三間虛構門市需要重新配置 Wi-Fi AP 與線路。</textarea></label><button class="btn primary" type="submit">送出測試案件</button></form><div id="list" class="list"></div></section><a href="/demo">返回三角色頁</a></main></body></html>
